version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '00:00'
      timezone: 'Europe/London'
    assignees:
      - dcrdev
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
      dependencies:
        dependency-type: production
        patterns:
          - '*'
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '00:00'
      timezone: 'Europe/London'
    assignees:
      - dcrdev
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    labels:
      - dependencies

  # The viewer's build tools. A bump can change the built page, so its pull request needs
  # `pnpm --dir viewer build` committed before the viewer job passes.
  - package-ecosystem: npm
    directory: /viewer
    schedule:
      interval: monthly
      timezone: 'Europe/London'
    assignees:
      - dcrdev
    commit-message:
      prefix: chore
      include: scope
    groups:
      viewer:
        patterns:
          - '*'
    labels:
      - dependencies
