name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  UV_FROZEN: '1'

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check --output-format=github

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Conventional Commits
        run: uv run cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Kodex Labs commit rules
        run: uv run python .kodex/scripts/check_commit_message.py --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kerplunk
          POSTGRES_PASSWORD: kerplunk
          POSTGRES_DB: kerplunk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kerplunk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      iceberg:
        image: apache/iceberg-rest-fixture:latest
        ports:
          - 8181:8181
    env:
      KERPLUNK_TEST_PG_DSN: postgresql://kerplunk:kerplunk@localhost:5432/kerplunk
      KERPLUNK_TEST_ICEBERG_URI: http://localhost:8181
      KERPLUNK_REQUIRE_SERVICES: '1'
      HYPOTHESIS_PROFILE: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync

      - name: Wait for the Iceberg REST catalog
        run: |
          for _ in $(seq 1 30); do
            curl -fs http://localhost:8181/v1/config >/dev/null && exit 0
            sleep 2
          done
          echo "The Iceberg REST catalog did not start"
          exit 1

      # Chromium and its system libraries take minutes to install, so the browser tests run once,
      # on the Python version the project develops against.
      - name: Cache Playwright's Chromium
        if: matrix.python == '3.12'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Chromium for the browser tests
        if: matrix.python == '3.12'
        run: uv run playwright install --with-deps chromium

      - name: Run tests with coverage
        if: matrix.python == '3.12'
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Run tests
        if: matrix.python != '3.12'
        run: uv run pytest -m "not browser"

      - name: Upload the coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  real-world:
    name: Real-world dbt project (dbt-labs/jaffle-shop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Clone, build and analyse the project
        env:
          KERPLUNK_REALWORLD: '1'
        run: uv run pytest tests/test_realworld.py

  airflow-parity:
    name: Airflow parser against Apache Airflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Compare static parsing with Airflow's DagBag
        run: >-
          uv run --with "apache-airflow>=3" --with apache-airflow-providers-standard
          --with apache-airflow-providers-common-sql
          python -m pytest tests/test_airflow_parity.py

  end-to-end:
    name: End to end (jaffle_shop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build the example warehouse and dbt project
        run: uv run python .kodex/scripts/prepare_example.py

      - name: Build the graph in under a minute
        run: |
          start=$(date +%s)
          uv run kerplunk build examples/jaffle_shop
          elapsed=$(( $(date +%s) - start ))
          echo "kerplunk build took ${elapsed}s"
          if [ "$elapsed" -ge 60 ]; then
            echo "ERROR: kerplunk build took ${elapsed}s, the limit is 60s"
            exit 1
          fi

      - name: Query the graph
        run: |
          cd examples/jaffle_shop
          uv run kerplunk impact stg_payments.amount
          uv run kerplunk trace orders.amount
          uv run kerplunk query "which models use payments"

      - name: Upload the graph
        uses: actions/upload-artifact@v7
        with:
          name: kerplunk-out
          path: examples/jaffle_shop/kerplunk-out

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Build the sdist and wheel
        run: uv build

      - name: Install the wheel as a tool
        run: |
          uv tool install dist/*.whl
          kerplunk --version
          kerplunk --help

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
