name: Create Release

# Runs after Build and Test passes on a push to main. main is protected, so nothing here pushes to
# it: a release is a tag on the tested commit, or on a commit above it, and a GitHub release.
#
# - When the tested commit carries a version with no tag (a pull request ran
#   .kodex/scripts/prepare_release.py), that commit is tagged and released.
# - Otherwise, when main has releasable commits since the last tag (a Dependabot fix, or a pull
#   request merged without preparing a release), the script writes the next version and changelog
#   section on a detached commit above main, and that commit is tagged and released.
# - A release left half done (its tag pushed but no GitHub release) is finished first.
#
# While the version is 0.x a release is a patch unless a change is marked breaking, which gives
# the next minor. Any version outside 0.x is refused: moving to 1.0 is the owner's decision, made
# by changing this workflow. Each release moves the v0 tag that action users pin and publishes the
# changelog section, the wheel and the sdist.
#
# Publishing to PyPI is a separate job that stays off until the PUBLISH_TO_PYPI repository
# variable is 'true' and a 'pypi' environment with trusted publishing exists.
on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_FROZEN: '1'

jobs:
  release:
    name: Create Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.plan.outputs.released }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Release only the commit that was tested
        id: current
        if: github.event_name == 'workflow_run'
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "main has moved on since this commit was tested; its own run will release it"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.current.outputs.stale != 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Work out what to release
        id: plan
        if: steps.current.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          version="$(uv version --short)"
          if [ -n "$latest" ] && ! gh release view "$latest" > /dev/null 2>&1; then
            echo "${latest} is tagged but has no GitHub release; finishing it"
            tag="$latest"
            git checkout --quiet "$tag"
          elif ! git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            tag="v${version}"
            echo "main carries ${tag}, prepared by its pull request"
          else
            next="$(python3 .kodex/scripts/prepare_release.py --base HEAD --no-fetch --dry-run | head -1)"
            if [ "${next#nothing}" != "$next" ]; then
              echo "Nothing to release since ${latest}"
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            tag="v${next}"
            echo "main has releasable changes since ${latest}; releasing ${tag} from a commit above main"
            git checkout --quiet --detach
            python3 .kodex/scripts/prepare_release.py --base HEAD --no-fetch
            git commit --quiet -am "chore(release): Release ${next}"
          fi
          case "$tag" in
            v0.*) ;;
            *) echo "::error::refusing to release ${tag}: Konstruct stays below 1.0 until the owner decides"; exit 1 ;;
          esac
          # The changelog section for this version, up to the next heading.
          awk -v heading="## ${tag} " 'index($0, heading) == 1 {found = 1; print; next}
            found && /^## v/ {exit} found {print}' CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          if [ ! -s "$RUNNER_TEMP/RELEASE_NOTES.md" ]; then
            echo "::error::CHANGELOG.md has no section for ${tag}"
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        if: steps.plan.outputs.released == 'true'
        run: uv build

      # Tags are pushed only once the build has succeeded; only tags are pushed, never main.
      - name: Tag and publish the release
        if: steps.plan.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            git tag "$TAG"
          fi
          git push origin "refs/tags/${TAG}"
          gh release create "$TAG" dist/* \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" \
              --verify-tag \
              --latest
          # GitHub Action users pin the major version (`uses: kodexlabsio/konstruct@v0`): move it.
          major="${TAG%%.*}"
          git tag -f "$major" "$TAG"
          git push -f origin "refs/tags/${major}"

      - name: Upload the distributions
        if: steps.plan.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
