name: Create Release

# Runs after Build and Test passes on a push to main. main is protected, so a release's version and
# changelog arrive through the pull request that releases: it runs .kodex/scripts/prepare_release.py,
# which sets the next version in pyproject.toml, uv.lock and konstruct/__init__.py and adds its
# section to CHANGELOG.md. While the version is 0.x a release is a patch unless a change is marked
# breaking (`feat!:` or a BREAKING CHANGE footer), which gives the next minor.
#
# When the tested commit carries a version that has no tag yet, this workflow tags it vX.Y.Z, moves
# the v0 tag that action users pin, and publishes a GitHub release with the changelog section, the
# wheel and the sdist. A push whose version is already released makes no release; if it has
# releasable commits, the run notes that the next pull request that prepares a release includes them.
#
# Publishing to PyPI is a separate job that stays off until the PUBLISH_TO_PYPI repository
# variable is 'true' and a 'pypi' environment with trusted publishing exists.
on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_FROZEN: '1'

jobs:
  release:
    name: Create Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Release only the commit that was tested
        id: current
        if: github.event_name == 'workflow_run'
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "main has moved on since this commit was tested; its own run will release it"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.current.outputs.stale != 'true'
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Find the version to release
        id: version
        if: steps.current.outputs.stale != 'true'
        run: |
          version="$(uv version --short)"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "${tag} is already released"
            pending="$(git log "${tag}..HEAD" --no-merges --format=%s | grep -E '^(feat|fix|perf|refactor)(\(|!|:)' || true)"
            if [ -n "$pending" ]; then
              echo "::notice::Unreleased changes since ${tag}; the next pull request that runs .kodex/scripts/prepare_release.py releases them"
            fi
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The changelog section prepare_release.py wrote for this version, up to the next heading.
          awk -v heading="## ${tag} " 'index($0, heading) == 1 {found = 1; print; next}
            found && /^## v/ {exit} found {print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for ${tag}"
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Lightweight tags, pushed by name; only tags are pushed, never main.
      - name: Tag the release
        if: steps.version.outputs.released == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "refs/tags/${tag}"
          # GitHub Action users pin the major version (`uses: kodexlabsio/konstruct@v0`): move it.
          major="${tag%%.*}"
          git tag -f "$major" "$tag"
          git push -f origin "refs/tags/${major}"

      - name: Build the sdist and wheel
        if: steps.version.outputs.released == 'true'
        run: uv build

      - name: Create the GitHub release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
              --title "${{ steps.version.outputs.tag }}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              --latest

      - name: Upload the distributions
        if: steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    name: Publish to PyPI
    needs: release
    if: needs.release.outputs.released == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
