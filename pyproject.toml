[project]
name = "kerplunk"
version = "0.1.1"
description = "Turn a data stack (dbt, SQL, Airflow, warehouse and Iceberg metadata) into a queryable graph with column-level lineage for coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kodex Labs Ltd." }]
requires-python = ">=3.11"
keywords = ["lineage", "column-level lineage", "dbt", "airflow", "iceberg", "mcp", "claude-code", "data-catalog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "sqlglot>=30.0",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
    "pyiceberg>=0.9",
    "mcp>=2.0",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/kodexlabsio/kerplunk"
Issues = "https://github.com/kodexlabsio/kerplunk/issues"

[project.scripts]
kerplunk = "kerplunk.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "mypy>=2.0",
    "ruff>=0.17",
    "types-PyYAML",
    "pyiceberg[sql-sqlite]>=0.9",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
    "commitizen>=4.19.3",
    "pre-commit>=4.7.0",
    "playwright>=1.64.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kerplunk"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4"]
ignore = ["E501", "SIM905"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/kerplunk", "tests"]
exclude = ["^tests/fixtures/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyiceberg.*", "duckdb.*", "airflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs a Postgres server (KERPLUNK_TEST_PG_DSN)",
    "dbt: needs dbt-core and dbt-duckdb installed",
    "iceberg: uses PyIceberg with a local SQL catalog",
    "browser: drives graph.html in Chromium through Playwright",
    "scale: builds a generated project of hundreds of models",
    "realworld: clones and builds a public dbt project (KERPLUNK_REALWORLD=1)",
    "airflow_parity: compares the static parser with Airflow itself (needs apache-airflow)",
    "iceberg_rest: needs an Iceberg REST catalog (KERPLUNK_TEST_ICEBERG_URI)",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
version_scheme = "pep440"
major_version_zero = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
version_files = ["src/kerplunk/__init__.py:__version__"]
bump_message = "chore(release): Release $new_version"

[tool.coverage.run]
branch = true
source = ["kerplunk"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
